name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_APP_PATH: ${{ secrets.VM_APP_PATH }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test
        env:
          DATABASE_URL: sqlite:///ci.sqlite3
          DJANGO_SECRET_KEY: ci-only-secret
        run: |
          pip install -r requirements.txt
          python manage.py test
          python manage.py makemigrations --check --dry-run
          node --check static/chat/app.js
          node --check static/imaging/image.js

      - name: Deploy skipped (VM secrets not configured)
        if: env.VM_HOST == '' || env.VM_USER == '' || env.VM_SSH_KEY == '' || env.VM_APP_PATH == ''
        run: |
          echo "::notice::Skipping deploy: set the VM_HOST, VM_USER, VM_SSH_KEY, and VM_APP_PATH repository secrets to enable automatic deployment (see README)."

      - name: Deploy to VM
        if: env.VM_HOST != '' && env.VM_USER != '' && env.VM_SSH_KEY != '' && env.VM_APP_PATH != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh "$VM_USER@$VM_HOST" "cd '$VM_APP_PATH' && git pull --ff-only origin main && venv/bin/pip install -r requirements.txt && bash start_server.sh restart"
