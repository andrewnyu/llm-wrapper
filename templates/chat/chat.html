{% extends "base.html" %}
{% block title %}Chat · VCY GPT{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="/static/chat/chat.css" />
{% endblock %}
{% block layout %}
<section class="messenger" id="chat-app" data-csrf-token="{{ csrf_token }}">
    <button id="sidebar-overlay" class="sidebar-overlay hidden" type="button" aria-label="Close conversations"></button>

    <aside id="chat-sidebar" class="messenger-sidebar">
        <header class="sidebar-header">
            <h1>Chats</h1>
            <button id="close-sidebar-btn" class="icon-btn mobile-only" type="button" aria-label="Close sidebar">✕</button>
        </header>

        <button id="new-chat-btn" class="new-chat-btn" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            New chat
        </button>
        <nav id="conversation-list" class="conversation-list" aria-label="Conversations"></nav>
    </aside>

    <main class="messenger-main">
        <header class="thread-header">
            <button id="open-sidebar-btn" class="icon-btn mobile-only" type="button" aria-label="Open conversations">☰</button>
            <div class="thread-title-wrap">
                <h2 id="thread-title">New chat</h2>
                <p id="thread-subtitle" class="thread-subtitle">Ask anything</p>
            </div>
        </header>

        <div class="thread-stage">
            <div id="thread-empty" class="thread-empty">
                <div class="empty-glyph" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <h3>How can I help today?</h3>
                <p>Pick a model below and start typing.</p>
            </div>
            <div id="message-list" class="message-list" aria-live="polite"></div>
            <button id="jump-latest-btn" class="jump-latest hidden" type="button">↓ Latest</button>
        </div>

        <footer class="composer-wrap">
            <div class="composer">
                <textarea
                    id="composer-input"
                    rows="1"
                    maxlength="8000"
                    placeholder="Message VCY GPT…"
                ></textarea>
                <div class="composer-bar">
                    <div class="model-switcher-wrap">
                        <label class="sr-only" for="model-switcher">AI model</label>
                        <select id="model-switcher" class="model-switcher" aria-label="AI model">
                            {% for item in chat_models %}
                                <option
                                    value="{{ item.provider }}::{{ item.model }}"
                                    data-provider="{{ item.provider }}"
                                    data-model="{{ item.model }}"
                                    data-label="{{ item.label }}"
                                    {% if not item.configured %}disabled{% endif %}
                                    {% if item.provider == default_provider and item.model == default_model %}selected{% endif %}
                                >{{ item.label }}{% if not item.configured %} · not configured{% endif %}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="composer-actions">
                        <button id="stop-btn" class="stop-btn hidden" type="button">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                            Stop
                        </button>
                        <button id="send-btn" class="send-btn" type="button" aria-label="Send message">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 20.85 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            <p class="composer-hint"><span id="model-hint">Enter to send · Shift+Enter for a new line</span></p>
        </footer>
    </main>
</section>
<script type="module" src="/static/chat/app.js"></script>
{% endblock %}
