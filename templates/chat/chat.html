{% extends "base.html" %}
{% block title %}Chat · API Key Wrapper{% endblock %}
{% block content %}
<div class="chat-app" id="chat-app" data-csrf-token="{{ csrf_token }}">
    <aside class="chat-conversations">
        <div class="chat-conversations-header">
            <h2>Chats</h2>
            <button id="new-chat-btn" class="primary">New Chat</button>
        </div>
        <div id="conversation-list" class="conversation-list"></div>
    </aside>
    <section class="chat-thread">
        <div id="thread-empty" class="thread-empty">Start a conversation to begin.</div>
        <div id="message-list" class="message-list" aria-live="polite"></div>
        <button id="jump-latest-btn" class="jump-latest hidden">Jump to latest</button>
        <div class="composer">
            <textarea
                id="composer-input"
                rows="1"
                maxlength="8000"
                placeholder="Message..."
            ></textarea>
            <div class="composer-actions">
                <button id="stop-btn" class="danger hidden" type="button">Stop</button>
                <button id="send-btn" class="primary" type="button">Send</button>
            </div>
        </div>
    </section>
</div>
<script type="module" src="/static/chat/app.js"></script>
{% endblock %}
