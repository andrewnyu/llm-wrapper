{% extends "base.html" %}
{% block title %}Chat · API Key Wrapper{% endblock %}
{% block content %}
<h1>Chat</h1>
<div class="controls">
    <label>Provider</label>
    <select id="provider">
        {% for value, label in provider_choices %}
            <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
    </select>
    <label>Model</label>
    <input id="model" type="text" value="gpt-4o-mini" />
</div>
<div id="chat-log" class="chat-log"></div>
<div class="chat-input">
    <textarea id="message" rows="3" placeholder="Type your message..."></textarea>
    <button id="send" class="primary">Send</button>
</div>

{{ model_defaults|json_script:"model-defaults" }}
<script>
    const modelDefaults = JSON.parse(document.getElementById('model-defaults').textContent);
    const providerSelect = document.getElementById('provider');
    const modelInput = document.getElementById('model');
    const sendButton = document.getElementById('send');
    const messageInput = document.getElementById('message');
    const chatLog = document.getElementById('chat-log');
    const csrfToken = '{{ csrf_token }}';

    let messages = [];
    let sessionId = null;

    function renderMessage(role, content) {
        const wrapper = document.createElement('div');
        wrapper.className = `chat-bubble ${role}`;
        wrapper.innerText = content;
        chatLog.appendChild(wrapper);
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    function updateModelDefaults() {
        const provider = providerSelect.value;
        const defaults = modelDefaults[provider] || [];
        if (defaults.length && !defaults.includes(modelInput.value)) {
            modelInput.value = defaults[0];
        }
    }

    providerSelect.addEventListener('change', updateModelDefaults);

    sendButton.addEventListener('click', async () => {
        const content = messageInput.value.trim();
        if (!content) {
            return;
        }
        const provider = providerSelect.value;
        const model = modelInput.value.trim();

        const userMessage = { role: 'user', content };
        messages.push(userMessage);
        renderMessage('user', content);
        messageInput.value = '';

        try {
            const response = await fetch('/api/chat/complete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                },
                body: JSON.stringify({
                    provider,
                    model,
                    messages,
                    session_id: sessionId,
                }),
            });
            const data = await response.json();
            if (!response.ok) {
                renderMessage('system', data.error || 'Request failed');
                return;
            }
            sessionId = data.session_id || sessionId;
            messages.push({ role: 'assistant', content: data.text });
            renderMessage('assistant', data.text);
        } catch (error) {
            renderMessage('system', 'Network error.');
        }
    });

    updateModelDefaults();
</script>
{% endblock %}
