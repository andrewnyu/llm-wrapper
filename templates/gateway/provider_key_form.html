{% extends "base.html" %}
{% block title %}{{ mode }} API Key · API Key Wrapper{% endblock %}
{% block content %}
<h1>{{ mode }} API Key</h1>
<form method="post">
    {% csrf_token %}
    <label>Provider</label>
    {{ form.provider }}
    <label>Name</label>
    {{ form.name }}
    <label>API Key</label>
    {{ form.api_key }}
    <div class="actions">
        <button type="submit" class="primary">Save</button>
        <a class="button" href="/keys/">Cancel</a>
    </div>
</form>
{% endblock %}
